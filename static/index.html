<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .video-upload-section {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .upload-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .video-preview {
            display: none;
            margin-top: 10px;
        }

        .video-preview.active {
            display: block;
        }

        .video-preview video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .video-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .remove-video-btn {
            padding: 5px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .analyze-video-btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .analyze-video-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .analyze-video-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            flex-shrink: 0;
        }

        .user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .bot .message-avatar {
            background: #e9ecef;
            color: #666;
        }

        .chat-input {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .chat-input button:active {
            transform: translateY(0);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        @media (max-width: 600px) {
            .chat-container {
                height: calc(100vh - 40px);
                border-radius: 10px;
            }

            .message-content {
                max-width: 85%;
            }
        }

        /* 自定义模态对话框样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-dialog {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        
        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .modal-btn-cancel {
            background: #e0e0e0;
            color: #666;
        }
        
        .modal-btn-cancel:hover {
            background: #d0d0d0;
        }
        
        .modal-btn-confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>豆包AI助手</h1>
            <p>基于 doubao-seed-2-0-pro-260215 大模型</p>
        </div>
        
        <div class="video-upload-section">
            <div class="upload-controls">
                <input type="text" id="videoUrlInput" placeholder="🔗 输入视频网页链接（如B站、爱奇艺等）" 
                       style="flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;"
                       oninput="handleVideoUrlInput(event)">
                <button id="loadVideoBtn" class="upload-btn" onclick="loadVideoFromUrl()" style="background: #007bff;">
                    📡 加载视频
                </button>
                <button id="analyzeVideoBtn" class="analyze-video-btn" onclick="analyzeVideo()" disabled>
                    🔍 分析视频
                </button>
                <button id="detectKeywordsBtn" class="analyze-video-btn" onclick="showKeywordSection()" style="background: #17a2b8;">
                    🔎 检测关键词
                </button>
            </div>
            
            <!-- 视频预览 -->
            <div class="video-preview" id="videoPreview">
                <div id="videoEmbedContainer" style="background: #000; min-height: 400px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                    <p style="color: #999; font-size: 14px;">请输入视频链接加载预览</p>
                </div>
                <div class="video-info" id="videoInfo"></div>
                <button class="remove-video-btn" onclick="removeVideo()">清除视频</button>
            </div>
            
            <!-- 关键词检测区域 -->
            <div id="keywordSection" style="display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <div style="margin-bottom: 10px; font-weight: bold; color: #333;">🎯 关键词检测设置</div>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 13px; color: #666; display: block; margin-bottom: 5px;">
                        输入要检测的关键词（用逗号分隔）：
                    </label>
                    <input type="text" id="keywordInput" placeholder="例如: 人工智能, 机器学习, Python" 
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <div style="font-size: 13px; color: #666; margin-bottom: 8px;">💡 快速添加常用词：</div>
                    <button onclick="addPresetKeyword('人工智能')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">人工智能</button>
                    <button onclick="addPresetKeyword('机器学习')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">机器学习</button>
                    <button onclick="addPresetKeyword('深度学习')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">深度学习</button>
                    <button onclick="addPresetKeyword('Python')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">Python</button>
                    <button onclick="addPresetKeyword('AI')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">AI</button>
                    <button onclick="addPresetKeyword('数据')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">数据</button>
                </div>
                <button id="startDetectBtn" class="analyze-video-btn" onclick="detectKeywords()" disabled style="background: #28a745;">
                    🚀 开始检测
                </button>
                <button onclick="hideKeywordSection()" style="margin-left: 10px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">收起</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">你好！我是豆包AI助手，有什么可以帮你的吗？</div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="输入你的问题..." onkeydown="handleKeyDown(event)">
            <button id="sendBtn" onclick="sendMessage()">
                <span id="btnText">发送</span>
                <span id="btnLoading" class="loading" style="display: none;"></span>
            </button>
        </div>
    </div>

    <!-- 自定义模态对话框 -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-dialog">
            <div class="modal-title" id="modalTitle">请输入</div>
            <input type="text" class="modal-input" id="modalInput" placeholder="">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let chatMessages, messageInput, sendBtn, btnText, btnLoading;
        let videoUrlInput, loadVideoBtn, videoPreview, videoInfo, analyzeVideoBtn, videoEmbedContainer;
        let selectedVideoUrl = null;
        let keywordInput, startDetectBtn;
        let modalCallback = null;

        // 自定义模态对话框函数
        function showModal(title, placeholder, defaultValue, callback) {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalInput = document.getElementById('modalInput');
            
            modalTitle.textContent = title;
            modalInput.placeholder = placeholder;
            modalInput.value = defaultValue || '';
            
            modalOverlay.style.display = 'flex';
            modalInput.focus();
            
            modalCallback = callback;
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modalOverlay');
            modalOverlay.style.display = 'none';
            modalCallback = null;
        }

        function confirmModal() {
            const modalInput = document.getElementById('modalInput');
            const value = modalInput.value.trim();
            
            closeModal();
            
            if (modalCallback && value) {
                modalCallback(value);
            }
        }

        // 按Enter键确认
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const modalOverlay = document.getElementById('modalOverlay');
                if (modalOverlay.style.display === 'flex') {
                    confirmModal();
                }
            }
        });

        // 初始化函数
        function initializeApp() {
            console.log('Initializing app...');
            
            // 获取DOM元素
            chatMessages = document.getElementById('chatMessages');
            messageInput = document.getElementById('messageInput');
            sendBtn = document.getElementById('sendBtn');
            btnText = document.getElementById('btnText');
            btnLoading = document.getElementById('btnLoading');
            videoUrlInput = document.getElementById('videoUrlInput');
            loadVideoBtn = document.getElementById('loadVideoBtn');
            videoPreview = document.getElementById('videoPreview');
            videoInfo = document.getElementById('videoInfo');
            analyzeVideoBtn = document.getElementById('analyzeVideoBtn');
            videoEmbedContainer = document.getElementById('videoEmbedContainer');
            keywordInput = document.getElementById('keywordInput');
            startDetectBtn = document.getElementById('startDetectBtn');

            console.log('DOM elements loaded:', {
                keywordInput: !!keywordInput,
                startDetectBtn: !!startDetectBtn,
                videoUrlInput: !!videoUrlInput
            });

            // 添加事件监听器
            if (keywordInput) {
                keywordInput.addEventListener('input', function(event) {
                    console.log('keywordInput changed:', event.target.value);
                    console.log('selectedVideoUrl:', selectedVideoUrl);
                    updateDetectButton();
                });
            }

            console.log('App initialized successfully');
        }

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializeApp);

        function showKeywordSection() {
            const section = document.getElementById('keywordSection');
            if (section.style.display === 'none') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        function hideKeywordSection() {
            document.getElementById('keywordSection').style.display = 'none';
        }

        function addPresetKeyword(keyword) {
            const currentText = keywordInput.value.trim();
            if (currentText) {
                // 检查是否已存在
                const keywords = currentText.split(',').map(k => k.trim());
                if (!keywords.includes(keyword)) {
                    keywordInput.value = currentText + ', ' + keyword;
                }
            } else {
                keywordInput.value = keyword;
            }
            // 启用检测按钮
            updateDetectButton();
        }

        function updateDetectButton() {
            const keywords = keywordInput.value.trim();
            const isDisabled = !selectedVideoUrl || !keywords;
            startDetectBtn.disabled = isDisabled;
            
            // 调试信息
            console.log('updateDetectButton:', {
                selectedVideoUrl: !!selectedVideoUrl,
                hasKeywords: !!keywords,
                isDisabled: isDisabled
            });
        }

        function handleVideoUrlInput(event) {
            const url = event.target.value.trim();
            if (url) {
                loadVideoBtn.disabled = false;
            } else {
                loadVideoBtn.disabled = true;
            }
        }

        function loadVideoFromUrl() {
            console.log('loadVideoFromUrl called!');
            
            const url = videoUrlInput.value.trim();
            if (!url) {
                alert('请输入视频链接');
                return;
            }

            // 简单验证URL格式
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('请输入有效的URL（以http://或https://开头）');
                return;
            }

            selectedVideoUrl = url;
            console.log('selectedVideoUrl set to:', selectedVideoUrl);
            videoPreview.classList.add('active');
            
            // 根据URL类型生成嵌入代码
            let embedHtml = '';
            
            if (url.includes('bilibili.com') || url.includes('b23.tv')) {
                // B站视频
                const videoId = extractBilibiliId(url);
                if (videoId) {
                    embedHtml = `<iframe src="https://player.bilibili.com/player.html?bvid=${videoId}&page=1" 
                                    scrolling="no" frameborder="0" 
                                    style="width: 100%; height: 100%;" 
                                    allowfullscreen="true"></iframe>`;
                } else {
                    embedHtml = `<p style="color: #ff6b6b;">无法解析B站视频链接</p>`;
                }
            } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
                // YouTube视频
                const videoId = extractYouTubeId(url);
                if (videoId) {
                    embedHtml = `<iframe src="https://www.youtube.com/embed/${videoId}" 
                                    frameborder="0" 
                                    style="width: 100%; height: 100%;" 
                                    allowfullscreen="true"></iframe>`;
                } else {
                    embedHtml = `<p style="color: #ff6b6b;">无法解析YouTube视频链接</p>`;
                }
            } else {
                // 通用链接，显示提示
                embedHtml = `<div style="text-align: center; padding: 20px;">
                    <p style="color: #17a2b8; font-size: 16px;">📹 视频链接已加载</p>
                    <p style="color: #999; font-size: 14px; margin-top: 10px;">${url}</p>
                    <p style="color: #666; font-size: 12px; margin-top: 15px;">💡 支持B站、YouTube等主流视频平台</p>
                </div>`;
            }
            
            videoEmbedContainer.innerHTML = embedHtml;
            videoInfo.textContent = `视频来源: ${getDomainName(url)}`;
            
            analyzeVideoBtn.disabled = false;
            console.log('Calling updateDetectButton after loading video...');
            updateDetectButton();
            console.log('After updateDetectButton - startDetectBtn.disabled:', startDetectBtn.disabled);
        }

        function extractBilibiliId(url) {
            // B站链接格式：https://www.bilibili.com/video/BV1xx411c7mD 或 https://b23.tv/xxx
            let match = url.match(/BV[\w]+/);
            if (match) return match[0];
            
            // 短链接解析
            if (url.includes('b23.tv')) {
                // 需要服务器端解析，这里简化处理
                return null;
            }
            return null;
        }

        function extractYouTubeId(url) {
            // YouTube链接格式
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /youtube\.com\/shorts\/([^&\n?#]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        function getDomainName(url) {
            try {
                const domain = new URL(url).hostname;
                if (domain.includes('bilibili')) return '哔哩哔哩';
                if (domain.includes('youtube')) return 'YouTube';
                if (domain.includes('iqiyi')) return '爱奇艺';
                if (domain.includes('qq.com')) return '腾讯视频';
                if (domain.includes('youku')) return '优酷';
                return domain;
            } catch {
                return '未知来源';
            }
        }

        function removeVideo() {
            selectedVideoUrl = null;
            videoUrlInput.value = '';
            videoEmbedContainer.innerHTML = '<p style="color: #999; font-size: 14px;">请输入视频链接加载预览</p>';
            videoPreview.classList.remove('active');
            videoInfo.textContent = '';
            analyzeVideoBtn.disabled = true;
            loadVideoBtn.disabled = true;
        }

        async function analyzeVideo() {
            if (!selectedVideoUrl) {
                alert('请先输入视频链接');
                return;
            }

            // 使用自定义模态对话框
            showModal(
                '视频分析',
                '请输入你想问关于这个视频的问题',
                '请描述这个视频的内容',
                function(message) {
                    if (!message) return;
                    
                    // 显示用户消息
                    addMessage(`[视频分析请求]\n视频链接: ${selectedVideoUrl}\n问题: ${message}`, 'user');

                    // 添加加载状态
                    const loadingDiv = document.createElement('div');
                    loadingDiv.className = 'message bot';
                    loadingDiv.innerHTML = `
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <div class="typing-indicator">
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                            </div>
                            正在分析视频...
                        </div>
                    `;
                    chatMessages.appendChild(loadingDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;

                    // 发送请求
                    fetch('/api/analyze-video', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            message: message,
                            video_url: selectedVideoUrl 
                        })
                    })
                    .then(response => {
                        // 移除加载状态
                        chatMessages.removeChild(loadingDiv);
                        
                        if (!response.ok) {
                            return response.json().then(errorData => {
                                throw new Error(errorData.detail || '视频分析失败');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        addMessage(data.response, 'bot');
                    })
                    .catch(error => {
                        // 移除加载状态
                        if (chatMessages.contains(loadingDiv)) {
                            chatMessages.removeChild(loadingDiv);
                        }
                        addMessage(`视频分析错误: ${error.message}`, 'bot');
                        console.error('Error:', error);
                    });
                }
            );
        }

        async function detectKeywords() {
            console.log('detectKeywords called!', {
                selectedVideoUrl: selectedVideoUrl,
                keywords: keywordInput.value.trim()
            });
            
            if (!selectedVideoUrl) {
                alert('请先输入视频链接');
                return;
            }

            const keywordsText = keywordInput.value.trim();
            if (!keywordsText) {
                alert('请输入要检测的关键词');
                return;
            }

            const keywords = keywordsText.split(',').map(k => k.trim()).filter(k => k);
            if (keywords.length === 0) {
                alert('请输入有效的关键词');
                return;
            }

            // 显示用户消息
            addMessage(`[关键词检测]\n视频链接: ${selectedVideoUrl}\n检测词汇: ${keywords.join(', ')}`, 'user');

            // 添加加载状态
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    正在检测关键词...
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/detect-keywords', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        keywords: keywords,
                        video_url: selectedVideoUrl 
                    })
                });

                // 移除加载状态
                chatMessages.removeChild(loadingDiv);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '关键词检测失败');
                }

                const data = await response.json();
                
                // 格式化结果
                let resultMessage = '✅ 关键词检测结果：\n\n';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(result => {
                        resultMessage += `🔍 "${result.keyword}"\n`;
                        if (result.matches && result.matches.length > 0) {
                            resultMessage += `   出现 ${result.matches.length} 次：\n`;
                            result.matches.forEach(match => {
                                resultMessage += `   ⏱️ ${match.timestamp} - ${match.context}\n`;
                            });
                        } else {
                            resultMessage += `   ❌ 未检测到\n`;
                        }
                        resultMessage += '\n';
                    });
                } else {
                    resultMessage = '❌ 未在视频中检测到任何关键词';
                }
                
                resultMessage += `\n📊 统计：共检测 ${data.total_matches || 0} 处匹配`;
                
                addMessage(resultMessage, 'bot');
            } catch (error) {
                // 移除加载状态
                if (chatMessages.contains(loadingDiv)) {
                    chatMessages.removeChild(loadingDiv);
                }
                addMessage(`关键词检测错误: ${error.message}`, 'bot');
                console.error('Error:', error);
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP ${response.status}: ${errorData.detail || '请求失败'}`);
                }

                const data = await response.json();
                addMessage(data.response, 'bot');
            } catch (error) {
                addMessage(`错误: ${error.message}`, 'bot');
                console.error('Error:', error);
            } finally {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                sendBtn.disabled = false;
            }
        }

        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
