<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI视频审核系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-left { display: flex; align-items: center; gap: 20px; }

        .header-icon {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.3);
        }

        .header-title { display: flex; flex-direction: column; }
        .header-title h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .header-title p { font-size: 13px; opacity: 0.7; margin-top: 3px; color: #94a3b8; }

        .header-right { display: flex; align-items: center; gap: 20px; }

        .status-badge {
            padding: 8px 18px;
            background: rgba(34, 197, 94, 0.15);
            border-radius: 24px;
            font-size: 13px; color: #4ade80;
            display: flex; align-items: center; gap: 8px;
            font-weight: 500; transition: all 0.3s;
        }
        .status-badge.offline { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .status-badge.checking { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .status-dot {
            width: 10px; height: 10px;
            background: #4ade80; border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .status-badge.offline .status-dot { background: #f87171; }
        .status-badge.checking .status-dot { background: #fbbf24; }

        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.9); } }

        .header-actions { display: flex; gap: 10px; }
        .header-btn {
            padding: 8px 16px;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.3);
            border-radius: 8px; color: #0ea5e9;
            font-size: 13px; cursor: pointer;
            transition: all 0.2s;
        }
        .header-btn:hover { background: rgba(14, 165, 233, 0.25); border-color: #0ea5e9; }

        .nav-bar {
            display: flex;
            background: #0f172a;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            padding: 18px 30px;
            color: #64748b;
            font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.25s;
            position: relative;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-item:hover { color: #f1f5f9; background: rgba(14, 165, 233, 0.08); }
        .nav-item.active { color: #0ea5e9; background: rgba(14, 165, 233, 0.1); }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 25%; right: 25%;
            height: 3px;
            background: linear-gradient(90deg, #0ea5e9, #06b6d4);
            border-radius: 3px;
        }

        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .control-panel {
            width: 400px;
            background: #0f172a;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px; font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
        }
        .upload-area:hover {
            border-color: rgba(14, 165, 233, 0.5);
            background: rgba(14, 165, 233, 0.05);
        }

        .upload-icon { font-size: 36px; margin-bottom: 12px; }
        .upload-text {
            font-size: 14px; color: #f1f5f9;
            margin-bottom: 8px;
        }
        .upload-hint {
            font-size: 12px; color: #64748b;
            line-height: 1.5;
        }

        #videoInput { display: none; }

        .video-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px;
        }

        .video-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .video-item:hover { background: rgba(255, 255, 255, 0.06); }

        .video-thumb {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        .video-info { flex: 1; min-width: 0; }
        .video-name {
            font-size: 13px; color: #f1f5f9;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .video-meta {
            font-size: 11px; color: #64748b;
            margin-top: 2px;
            display: flex; gap: 12px;
        }

        .video-remove {
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .video-remove:hover { color: #f87171; background: rgba(239, 68, 68, 0.1); }

        .input-group { margin-bottom: 12px; }
        .input-label {
            font-size: 13px; color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }

        .text-input, .textarea-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .text-input:focus, .textarea-input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .textarea-input {
            min-height: 100px;
            resize: vertical;
        }

        .quick-tags {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-top: 10px;
        }

        .quick-tag {
            padding: 6px 12px;
            background: rgba(14, 165, 233, 0.15);
            border-radius: 20px;
            font-size: 12px;
            color: #0ea5e9;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-tag:hover { background: rgba(14, 165, 233, 0.25); }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        .action-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }
        .action-btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .action-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }

        .results-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .results-header {
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .results-title {
            font-size: 14px; font-weight: 600;
            color: #f1f5f9;
        }

        .results-filter {
            display: flex; gap: 8px;
        }

        .filter-btn {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.3);
            color: #0ea5e9;
        }

        .results-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 300px;
            color: #64748b;
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title {
            font-size: 16px; font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .empty-hint { font-size: 13px; text-align: center; }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            display: flex; flex-direction: column;
            align-items: center;
        }

        .stat-icon { font-size: 24px; margin-bottom: 8px; }
        .stat-value {
            font-size: 32px; font-weight: 700;
            color: #f1f5f9;
        }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }

        .stat-card.pass .stat-value { color: #4ade80; }
        .stat-card.fail .stat-value { color: #f87171; }
        .stat-card.rate .stat-value { color: #0ea5e9; }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 4px solid rgba(14, 165, 233, 0.5);
        }
        .result-card.pass { border-left-color: #4ade80; }
        .result-card.fail { border-left-color: #f87171; }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .result-video-info {
            display: flex; gap: 12px;
        }

        .result-video-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        .result-video-detail { display: flex; flex-direction: column; }
        .result-video-name {
            font-size: 14px; font-weight: 600;
            color: #f1f5f9;
        }
        .result-video-meta {
            font-size: 12px; color: #64748b;
            margin-top: 4px;
        }

        .result-status-row { display: flex; gap: 12px; align-items: center; }

        .result-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px; font-weight: 500;
        }
        .result-status.pass {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .result-status.fail {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .result-score {
            font-size: 12px; color: #0ea5e9;
        }

        .result-content {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-section { margin-bottom: 12px; }
        .result-section:last-child { margin-bottom: 0; }

        .result-section-title {
            font-size: 12px; font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .result-text {
            font-size: 13px; color: #e2e8f0;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .timestamps-list {
            display: flex; flex-wrap: wrap; gap: 8px;
        }

        .timestamp-tag {
            padding: 4px 10px;
            background: rgba(14, 165, 233, 0.15);
            border-radius: 6px;
            font-size: 12px;
            color: #0ea5e9;
        }

        .footer {
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 13px; color: #64748b;
        }

        .footer-left, .footer-right { display: flex; align-items: center; gap: 20px; }
        .footer-item { display: flex; align-items: center; gap: 6px; }
        .footer-value { color: #0ea5e9; font-weight: 500; }

        @media (max-width: 900px) {
            .content-area { flex-direction: column; }
            .control-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                max-height: 50%;
            }
            .stats-panel { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .main-container { height: 95vh; border-radius: 12px; }
            .header { padding: 16px 20px; }
            .header-title h1 { font-size: 18px; }
            .nav-item { padding: 14px 16px; font-size: 12px; }
            .stats-panel { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">🎯</div>
                <div class="header-title">
                    <h1>AI视频审核系统</h1>
                    <p>基于豆包大模型 · 智能内容审核</p>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot"></div>
                    <span id="statusText">检测中</span>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="generateReport()">📈 报告</button>
                </div>
            </div>
        </div>

        <!-- 功能导航栏 -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchMode('review')">✅ 合规检测</div>
            <div class="nav-item" onclick="switchMode('keyword')">🔍 关键词检测</div>
            <div class="nav-item" onclick="switchMode('batch')">⚡ 批量检测</div>
        </div>

        <!-- 主内容区域 -->
        <div class="content-area">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <!-- 视频上传 -->
                <div class="panel-section">
                    <div class="section-title">📁 视频文件</div>
                    <label class="upload-area" for="videoInput">
                        <div class="upload-icon">🎬</div>
                        <div class="upload-text">点击或拖拽上传视频</div>
                        <div class="upload-hint">支持 MP4, AVI, MOV 等格式<br>单文件最大512MB</div>
                    </label>
                    <input type="file" id="videoInput" accept="video/*" multiple onchange="handleVideoSelect(event)">
                </div>

                <!-- 已选择视频列表 -->
                <div class="panel-section">
                    <div class="section-title">📋 已选择视频</div>
                    <div class="video-list" id="videoList">
                        <div style="text-align: center; padding: 24px; color: #64748b; font-size: 13px;">暂无视频</div>
                    </div>
                </div>

                <!-- 检测设置 -->
                <div class="panel-section" id="settingsSection">
                    <div class="section-title" id="settingsTitle">⚙️ 检测设置</div>
                    <div id="settingsArea">
                        <!-- 合规检测设置 -->
                        <div id="reviewSettings">
                            <div class="input-group">
                                <label class="input-label">审核标准</label>
                                <textarea id="reviewRequirements" class="textarea-input" placeholder="请输入视频审核标准，例如：视频内容必须积极健康，不能包含敏感内容、暴力、色情等不良信息"></textarea>
                            </div>
                        </div>

                        <!-- 关键词检测设置 -->
                        <div id="keywordSettings" style="display: none;">
                            <div class="input-group">
                                <label class="input-label">检测关键词</label>
                                <input type="text" id="keywordInput" class="text-input" placeholder="输入关键词，用逗号分隔">
                            </div>
                            <div class="quick-tags">
                                <span class="quick-tag" onclick="addKeyword('敏感词')">🚫 敏感词</span>
                                <span class="quick-tag" onclick="addKeyword('违规')">⚠️ 违规</span>
                                <span class="quick-tag" onclick="addKeyword('广告')">📣 广告</span>
                                <span class="quick-tag" onclick="addKeyword('暴力')">💣 暴力</span>
                                <span class="quick-tag" onclick="addKeyword('色情')">🔥 色情</span>
                                <span class="quick-tag" onclick="addKeyword('政治')">🏛️ 政治</span>
                            </div>
                        </div>

                        <!-- 批量检测设置 -->
                        <div id="batchSettings" style="display: none;">
                            <div class="input-group">
                                <label class="input-label">统一审核标准</label>
                                <textarea id="batchRequirements" class="textarea-input" placeholder="所有视频使用此标准进行检测，例如：视频内容必须包含产品介绍，画面清晰，无敏感内容"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="panel-section" style="margin-top: auto;">
                    <button id="startBtn" class="action-btn action-btn-primary" onclick="startDetection()" disabled>
                        <span>✨</span>
                        <span id="btnText">开始检测</span>
                    </button>
                    <button class="action-btn action-btn-secondary" onclick="clearAll()" style="margin-top: 10px;">
                        <span>🔄</span>
                        <span>清空所有</span>
                    </button>
                </div>
            </div>

            <!-- 右侧结果面板 -->
            <div class="results-panel">
                <div class="results-header">
                    <div class="results-title" id="resultsCount">共 0 个视频</div>
                    <div class="results-filter">
                        <button class="filter-btn active" onclick="setFilter('all')">全部</button>
                        <button class="filter-btn" onclick="setFilter('pass')">✅ 通过</button>
                        <button class="filter-btn" onclick="setFilter('fail')">❌ 不通过</button>
                    </div>
                </div>
                <div class="results-content" id="resultsContent">
                    <div class="empty-state">
                        <div class="empty-icon">📈</div>
                        <div class="empty-title">暂无审核结果</div>
                        <div class="empty-hint">上传视频并设置检测条件后，点击"开始检测"获取结果</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部状态栏 -->
        <div class="footer">
            <div class="footer-left">
                <div class="footer-item">
                    <span>模型:</span>
                    <span class="footer-value">doubao-seed-2-0-pro-260215</span>
                </div>
                <div class="footer-item">
                    <span>版本:</span>
                    <span>v1.0.0</span>
                </div>
            </div>
            <div class="footer-right">
                <div class="footer-item">
                    <span>已处理:</span>
                    <span class="footer-value" id="processedCount">0</span>
                </div>
                <div class="footer-item">
                    <span>耗时:</span>
                    <span class="footer-value" id="processingTime">0s</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedVideos = [];
        let currentMode = 'review';
        let processedCount = 0;
        let currentResults = [];
        let filterType = 'all';

        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const videoInput = document.getElementById('videoInput');
        const videoList = document.getElementById('videoList');
        const reviewRequirements = document.getElementById('reviewRequirements');
        const keywordInput = document.getElementById('keywordInput');
        const batchRequirements = document.getElementById('batchRequirements');
        const keywordSettings = document.getElementById('keywordSettings');
        const reviewSettings = document.getElementById('reviewSettings');
        const batchSettings = document.getElementById('batchSettings');
        const settingsTitle = document.getElementById('settingsTitle');
        const settingsArea = document.getElementById('settingsArea');
        const startBtn = document.getElementById('startBtn');
        const btnText = document.getElementById('btnText');
        const resultsContent = document.getElementById('resultsContent');
        const resultsCount = document.getElementById('resultsCount');
        const processedCountEl = document.getElementById('processedCount');
        const processingTimeEl = document.getElementById('processingTime');

        function checkServiceStatus() {
            fetch('/api/health')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        statusBadge.className = 'status-badge';
                        statusText.textContent = '服务正常';
                    } else {
                        statusBadge.className = 'status-badge offline';
                        statusText.textContent = '服务异常';
                    }
                })
                .catch(() => {
                    statusBadge.className = 'status-badge offline';
                    statusText.textContent = '服务不可用';
                });
        }

        setInterval(checkServiceStatus, 5000);
        checkServiceStatus();

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.nav-item[onclick="switchMode('${mode}')"]`).classList.add('active');

            reviewSettings.style.display = mode === 'review' ? 'block' : 'none';
            keywordSettings.style.display = mode === 'keyword' ? 'block' : 'none';
            batchSettings.style.display = mode === 'batch' ? 'block' : 'none';

            const titles = {
                review: '⚙️ 检测设置',
                keyword: '🔍 关键词设置',
                batch: '📦 批量检测设置'
            };
            settingsTitle.textContent = titles[mode];
            updateStartButton();
        }

        function handleVideoSelect(event) {
            const files = Array.from(event.target.files);
            const MAX_SIZE = 512 * 1024 * 1024;
            
            files.forEach(file => {
                const isDuplicate = selectedVideos.some(v => v.name === file.name && v.size === file.size);
                if (!isDuplicate && file.size <= MAX_SIZE) {
                    selectedVideos.push(file);
                }
            });
            event.target.value = '';
            renderVideoList();
            updateStartButton();
        }

        function renderVideoList() {
            if (selectedVideos.length === 0) {
                videoList.innerHTML = '<div style="text-align: center; padding: 24px; color: #64748b; font-size: 13px;">暂无视频</div>';
                return;
            }

            videoList.innerHTML = selectedVideos.map((video, index) => {
                const sizeMB = (video.size / (1024 * 1024)).toFixed(2);
                const date = new Date(video.lastModified).toLocaleDateString('zh-CN');
                return `
                    <div class="video-item" data-index="${index}">
                        <div class="video-thumb">🎥</div>
                        <div class="video-info">
                            <div class="video-name">${video.name}</div>
                            <div class="video-meta">
                                <span class="video-size">💾 ${sizeMB} MB</span>
                                <span>🕐 ${date}</span>
                            </div>
                        </div>
                        <div class="video-remove" onclick="removeVideo(${index})">✖️</div>
                    </div>
                `;
            }).join('');
        }

        function removeVideo(index) {
            selectedVideos.splice(index, 1);
            renderVideoList();
            updateStartButton();
        }

        function addKeyword(keyword) {
            const current = keywordInput.value;
            const keywords = current ? current.split(',').map(k => k.trim()).filter(k => k) : [];
            if (!keywords.includes(keyword)) {
                keywords.push(keyword);
                keywordInput.value = keywords.join(', ');
            }
            updateStartButton();
        }

        function updateStartButton() {
            const hasVideos = selectedVideos.length > 0;
            let hasSettings = false;

            switch(currentMode) {
                case 'review':
                    hasSettings = reviewRequirements.value.trim().length > 0;
                    break;
                case 'keyword':
                    hasSettings = keywordInput.value.trim().length > 0;
                    break;
                case 'batch':
                    hasSettings = batchRequirements.value.trim().length > 0;
                    break;
            }

            startBtn.disabled = !(hasVideos && hasSettings);
            btnText.textContent = hasVideos && hasSettings ? '开始检测' : '请上传视频并设置检测条件';
        }

        async function startDetection() {
            if (selectedVideos.length === 0) return;

            startBtn.disabled = true;
            btnText.textContent = '检测中...';

            const startTime = Date.now();
            const results = [];

            for (let i = 0; i < selectedVideos.length; i++) {
                const video = selectedVideos[i];
                try {
                    const result = await processVideo(video, i + 1, selectedVideos.length);
                    results.push(result);
                } catch (error) {
                    results.push({
                        name: video.name,
                        status: 'fail',
                        aiReply: `检测失败: ${error.message}`,
                        timestamps: []
                    });
                }
            }

            currentResults = results;
            processedCount += results.length;
            processedCountEl.textContent = processedCount;

            const endTime = Date.now();
            const elapsed = Math.round((endTime - startTime) / 1000);
            processingTimeEl.textContent = `${elapsed}s`;

            renderResults(results);
            startBtn.disabled = false;
            btnText.textContent = '开始检测';
        }

        async function processVideo(video, current, total) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('video', video);

                if (currentMode === 'review') {
                    formData.append('requirements', reviewRequirements.value);
                } else if (currentMode === 'keyword') {
                    formData.append('keywords', keywordInput.value);
                } else if (currentMode === 'batch') {
                    formData.append('requirements', batchRequirements.value);
                }
                formData.append('mode', currentMode);

                fetch('/api/analyze-video', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.detail || err.error || '请求失败');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error || data.detail) {
                        reject(new Error(data.error || data.detail));
                    } else {
                        resolve({
                            name: video.name,
                            status: data.status || (data.pass ? 'pass' : 'fail'),
                            score: data.score,
                            aiReply: data.analysis || data.result || data.message || '检测完成',
                            timestamps: data.timestamps || []
                        });
                    }
                })
                .catch(error => reject(error));
            });
        }

        function renderResults(results) {
            if (results.length === 0) {
                resultsContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📈</div>
                        <div class="empty-title">暂无审核结果</div>
                        <div class="empty-hint">上传视频并设置检测条件后，点击"开始检测"获取结果</div>
                    </div>
                `;
                resultsCount.textContent = '共 0 个视频';
                return;
            }

            const filteredResults = filterType === 'all' ? results : results.filter(r => r.status === filterType);

            const passedCount = results.filter(r => r.status === 'pass').length;
            const failedCount = results.filter(r => r.status === 'fail').length;
            const passRate = results.length > 0 ? Math.round((passedCount / results.length) * 100) : 0;

            let html = `
                <div class="stats-panel">
                    <div class="stat-card total">
                        <div class="stat-icon">🎥</div>
                        <div class="stat-value">${results.length}</div>
                        <div class="stat-label">总视频数</div>
                    </div>
                    <div class="stat-card pass">
                        <div class="stat-icon">✅</div>
                        <div class="stat-value">${passedCount}</div>
                        <div class="stat-label">通过</div>
                    </div>
                    <div class="stat-card fail">
                        <div class="stat-icon">❌</div>
                        <div class="stat-value">${failedCount}</div>
                        <div class="stat-label">不通过</div>
                    </div>
                    <div class="stat-card rate">
                        <div class="stat-icon">📈</div>
                        <div class="stat-value">${passRate}%</div>
                        <div class="stat-label">通过率</div>
                    </div>
                </div>
            `;

            if (filteredResults.length === 0) {
                html += `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">暂无匹配结果</div>
                        <div class="empty-hint">当前筛选条件下没有找到匹配的审核结果</div>
                    </div>
                `;
                resultsContent.innerHTML = html;
                return;
            }

            filteredResults.forEach(result => {
                let cardContent = `
                    <div class="result-section">
                        <div class="result-section-title">AI 分析结果</div>
                        <div class="result-text">${result.aiReply}</div>
                    </div>
                `;

                if (result.timestamps && result.timestamps.length > 0) {
                    cardContent += `
                        <div class="result-section">
                            <div class="result-section-title">检测到的关键词时间戳</div>
                            <div class="timestamps-list">
                                ${result.timestamps.map(t => `<span class="timestamp-tag">${t.keyword}: ${t.time}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="result-card ${result.status}">
                        <div class="result-header">
                            <div class="result-video-info">
                                <div class="result-video-icon">🎥</div>
                                <div class="result-video-detail">
                                    <div class="result-video-name">${result.name}</div>
                                    <div class="result-video-meta">检测模式: ${currentMode === 'keyword' ? '关键词检测' : '合规检测'}</div>
                                </div>
                            </div>
                            <div class="result-status-row">
                                <span class="result-status ${result.status}">
                                    ${result.status === 'pass' ? '✅ 通过' : '❌ 不通过'}
                                </span>
                                ${result.score !== undefined ? `<span class="result-score">评分: ${result.score}/100</span>` : ''}
                            </div>
                        </div>
                        ${cardContent}
                    </div>
                `;
            });

            resultsContent.innerHTML = html;
            resultsCount.textContent = `共 ${filteredResults.length} 个视频`;
        }

        function setFilter(filter) {
            filterType = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.filter-btn[onclick="setFilter('${filter}')"]`).classList.add('active');
            renderResults(currentResults);
        }

        function clearAll() {
            selectedVideos = [];
            currentResults = [];
            videoInput.value = '';
            reviewRequirements.value = '';
            keywordInput.value = '';
            batchRequirements.value = '';
            renderVideoList();
            updateStartButton();
            resultsContent.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📈</div>
                    <div class="empty-title">暂无审核结果</div>
                    <div class="empty-hint">上传视频并设置检测条件后，点击"开始检测"获取结果</div>
                </div>
            `;
            resultsCount.textContent = '共 0 个视频';
            processingTimeEl.textContent = '0s';
            processedCount = 0;
            processedCountEl.textContent = '0';
        }

        function generateReport() {
            if (currentResults.length === 0) {
                alert('暂无审核结果可导出');
                return;
            }

            let csv = '视频名称,审核结果,AI回复\n';
            currentResults.forEach(result => {
                const name = `"${result.name.replace(/"/g, '""')}"`;
                const status = result.status === 'pass' ? '通过' : '不通过';
                const reply = `"${(result.aiReply || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`;
                csv += `${name},${status},${reply}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `视频审核报告_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        reviewRequirements.addEventListener('input', updateStartButton);
        keywordInput.addEventListener('input', updateStartButton);
        batchRequirements.addEventListener('input', updateStartButton);
    </script>
</body>
</html>
