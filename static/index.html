<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .video-upload-section {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .upload-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .analyze-video-btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .analyze-video-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .analyze-video-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            flex-shrink: 0;
        }

        .user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .bot .message-avatar {
            background: #e9ecef;
            color: #666;
        }

        .chat-input {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .chat-input button:active {
            transform: translateY(0);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        @media (max-width: 600px) {
            .chat-container {
                height: calc(100vh - 40px);
                border-radius: 10px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>豆包AI助手</h1>
            <p>基于 doubao-seed-2-0-pro-260215 大模型</p>
        </div>
        
        <div class="video-upload-section">
            <div class="upload-controls">
                <button class="upload-btn" onclick="document.getElementById('videoInput').click()">
                    📹 上传视频
                </button>
                <input type="file" id="videoInput" accept="video/*" style="display: none" onchange="handleVideoSelect(event)">
                <button id="detectKeywordsBtn" class="analyze-video-btn" onclick="showKeywordSection()" style="background: #17a2b8;">
                    🔎 检测关键词
                </button>
                <button id="reviewVideoBtn" class="analyze-video-btn" onclick="showReviewSection()" style="background: #ffc107; color: #333;">
                    📋 合规检测
                </button>
            </div>
            
            <!-- 关键词检测区域 -->
            <div id="keywordSection" style="display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <div style="margin-bottom: 10px; font-weight: bold; color: #333;">🎯 关键词检测设置</div>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 13px; color: #666; display: block; margin-bottom: 5px;">
                        输入要检测的关键词（用逗号分隔）：
                    </label>
                    <input type="text" id="keywordInput" placeholder="例如: 人工智能, 机器学习, Python" 
                           style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <div style="font-size: 13px; color: #666; margin-bottom: 8px;">💡 快速添加常用词：</div>
                    <button onclick="addPresetKeyword('人工智能')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">人工智能</button>
                    <button onclick="addPresetKeyword('机器学习')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">机器学习</button>
                    <button onclick="addPresetKeyword('深度学习')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">深度学习</button>
                    <button onclick="addPresetKeyword('Python')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">Python</button>
                    <button onclick="addPresetKeyword('AI')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">AI</button>
                    <button onclick="addPresetKeyword('数据')" style="margin: 3px; padding: 5px 12px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 15px; cursor: pointer; font-size: 12px;">数据</button>
                </div>
                <button id="startDetectBtn" class="analyze-video-btn" onclick="detectKeywords()" disabled style="background: #28a745;">
                    🚀 开始检测
                </button>
                <button onclick="hideKeywordSection()" style="margin-left: 10px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">收起</button>
            </div>
            
            <!-- 视频合规检测区域 -->
            <div id="reviewSection" style="display: none; margin-top: 15px; padding: 15px; background: #fff3cd; border-radius: 8px; border: 1px solid #ffeeba;">
                <div style="margin-bottom: 10px; font-weight: bold; color: #856404;">📋 视频合规检测</div>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 13px; color: #666; display: block; margin-bottom: 5px;">
                        输入检测要求（描述视频需要满足的条件）：
                    </label>
                    <textarea id="reviewRequirements" placeholder="例如: 视频内容必须包含产品介绍，时长不少于30秒，不能有敏感内容，需要清晰展示产品使用方法..." 
                              style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; min-height: 100px; resize: vertical;"></textarea>
                </div>
                <button id="startReviewBtn" class="analyze-video-btn" onclick="reviewVideo()" disabled style="background: #17a2b8;">
                    ✅ 开始检测
                </button>
                <button onclick="hideReviewSection()" style="margin-left: 10px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">收起</button>
            </div>
            
            <!-- 已选择视频信息 -->
            <div id="selectedVideoInfo" style="display: none; margin-top: 15px; padding: 10px; background: #d4edda; border-radius: 8px; color: #155724;">
                <span id="videoName"></span>
                <button onclick="clearVideo()" style="margin-left: 10px; padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">清除</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">你好！我是豆包AI助手，有什么可以帮你的吗？</div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="输入你的问题..." onkeydown="handleKeyDown(event)">
            <button id="sendBtn" onclick="sendMessage()">
                <span id="btnText">发送</span>
                <span id="btnLoading" class="loading" style="display: none;"></span>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const videoInput = document.getElementById('videoInput');
        const selectedVideoInfo = document.getElementById('selectedVideoInfo');
        const videoName = document.getElementById('videoName');

        let selectedVideo = null;
        const keywordInput = document.getElementById('keywordInput');
        const startDetectBtn = document.getElementById('startDetectBtn');
        const reviewRequirements = document.getElementById('reviewRequirements');
        const startReviewBtn = document.getElementById('startReviewBtn');

        function showKeywordSection() {
            const section = document.getElementById('keywordSection');
            if (section.style.display === 'none') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        function hideKeywordSection() {
            document.getElementById('keywordSection').style.display = 'none';
        }

        function showReviewSection() {
            const section = document.getElementById('reviewSection');
            if (section.style.display === 'none') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        function hideReviewSection() {
            document.getElementById('reviewSection').style.display = 'none';
        }

        function addPresetKeyword(keyword) {
            const currentText = keywordInput.value.trim();
            if (currentText) {
                // 检查是否已存在
                const keywords = currentText.split(',').map(k => k.trim());
                if (!keywords.includes(keyword)) {
                    keywordInput.value = currentText + ', ' + keyword;
                }
            } else {
                keywordInput.value = keyword;
            }
            // 启用检测按钮
            updateDetectButton();
        }

        function updateDetectButton() {
            const keywords = keywordInput.value.trim();
            startDetectBtn.disabled = !selectedVideo || !keywords;
        }

        function updateReviewButton() {
            const requirements = reviewRequirements.value.trim();
            startReviewBtn.disabled = !selectedVideo || !requirements;
        }

        // 监听关键词输入变化
        keywordInput.addEventListener('input', updateDetectButton);
        // 监听合规检测要求输入变化
        reviewRequirements.addEventListener('input', updateReviewButton);

        async function detectKeywords() {
            if (!selectedVideo) {
                alert('请先选择视频');
                return;
            }

            const keywordsText = keywordInput.value.trim();
            if (!keywordsText) {
                alert('请输入要检测的关键词');
                return;
            }

            const keywords = keywordsText.split(',').map(k => k.trim()).filter(k => k);
            if (keywords.length === 0) {
                alert('请输入有效的关键词');
                return;
            }

            // 显示用户消息
            addMessage(`[关键词检测]\n检测词汇: ${keywords.join(', ')}`, 'user');

            // 添加加载状态
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <div id="progress-text">正在上传视频...</div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('keywords', JSON.stringify(keywords));
                formData.append('video', selectedVideo);

                // 创建带超时的请求
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                }, 300000); // 5分钟超时

                const response = await fetch('/api/detect-keywords', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                // 移除加载状态（检查元素是否存在）
                if (chatMessages.contains(loadingDiv)) {
                    chatMessages.removeChild(loadingDiv);
                }

                if (!response.ok) {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch {
                        errorData = { detail: `HTTP错误: ${response.status}` };
                    }
                    throw new Error(errorData.detail || '关键词检测失败');
                }

                const data = await response.json();
                
                // 格式化结果
                let resultMessage = '✅ 关键词检测结果：\n\n';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(result => {
                        resultMessage += `🔍 "${result.keyword}"\n`;
                        if (result.matches && result.matches.length > 0) {
                            resultMessage += `   出现 ${result.matches.length} 次：\n`;
                            result.matches.forEach(match => {
                                resultMessage += `   ⏱️ ${match.timestamp} - ${match.context}\n`;
                            });
                        } else {
                            resultMessage += `   ❌ 未检测到\n`;
                        }
                        resultMessage += '\n';
                    });
                } else {
                    resultMessage = '❌ 未在视频中检测到任何关键词';
                }
                
                resultMessage += `\n📊 统计：共检测 ${data.total_matches || 0} 处匹配`;
                
                addMessage(resultMessage, 'bot');
            } catch (error) {
                // 移除加载状态
                if (chatMessages.contains(loadingDiv)) {
                    chatMessages.removeChild(loadingDiv);
                }
                
                let errorMsg = error.message;
                if (error.name === 'AbortError') {
                    errorMsg = '请求超时，请尝试使用较短的视频';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMsg = '服务器连接失败，请检查网络或重试';
                }
                
                addMessage(`关键词检测错误: ${errorMsg}`, 'bot');
                console.error('Error:', error);
            }
        }

        function handleVideoSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedVideo = file;
                
                // 显示已选择的视频信息
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                videoName.textContent = `📹 ${file.name} (${sizeMB} MB)`;
                selectedVideoInfo.style.display = 'block';
                
                updateDetectButton(); // 更新关键词检测按钮状态
                updateReviewButton(); // 更新合规检测按钮状态
            }
        }

        function clearVideo() {
            selectedVideo = null;
            selectedVideoInfo.style.display = 'none';
            videoInput.value = '';
            updateDetectButton(); // 更新关键词检测按钮状态
            updateReviewButton(); // 更新合规检测按钮状态
        }

        async function reviewVideo() {
            if (!selectedVideo) {
                alert('请先选择视频');
                return;
            }

            const requirements = reviewRequirements.value.trim();
            if (!requirements) {
                alert('请输入检测要求');
                return;
            }

            // 显示用户消息
            addMessage(`[视频合规检测]\n检测要求: ${requirements}`, 'user');

            // 添加加载状态
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <div id="progress-text">正在上传视频并分析...</div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('requirements', requirements);
                formData.append('video', selectedVideo);

                // 创建带超时的请求
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                }, 300000); // 5分钟超时

                const response = await fetch('/api/review-video', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                // 移除加载状态（检查元素是否存在）
                if (chatMessages.contains(loadingDiv)) {
                    chatMessages.removeChild(loadingDiv);
                }

                if (!response.ok) {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch {
                        errorData = { detail: `HTTP错误: ${response.status}` };
                    }
                    throw new Error(errorData.detail || '视频检测失败');
                }

                const data = await response.json();
                
                // 格式化结果
                let resultMessage = '';
                if (data.pass) {
                    resultMessage = `✅ 通过\n\n`;
                    resultMessage += `评估结果: ${data.result}\n\n`;
                    if (data.reasons && data.reasons.length > 0) {
                        resultMessage += `符合要求的理由:\n`;
                        data.reasons.forEach((reason, index) => {
                            resultMessage += `${index + 1}. ${reason}\n`;
                        });
                    }
                } else {
                    resultMessage = `❌ 不通过\n\n`;
                    resultMessage += `评估结果: ${data.result}\n\n`;
                    if (data.issues && data.issues.length > 0) {
                        resultMessage += `不符合要求的问题:\n`;
                        data.issues.forEach((issue, index) => {
                            resultMessage += `${index + 1}. ${issue}\n`;
                        });
                    }
                }
                
                addMessage(resultMessage, 'bot');
            } catch (error) {
                // 移除加载状态（检查元素是否存在）
                try {
                    if (loadingDiv.parentNode === chatMessages) {
                        chatMessages.removeChild(loadingDiv);
                    }
                } catch (e) {
                    console.warn('加载状态已移除');
                }
                
                let errorMsg = error.message;
                if (error.name === 'AbortError') {
                    errorMsg = '请求超时，请尝试使用较短的视频';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMsg = '服务器连接失败，请检查网络或重试';
                }
                
                addMessage(`视频检测错误: ${errorMsg}`, 'bot');
                console.error('Error:', error);
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP ${response.status}: ${errorData.detail || '请求失败'}`);
                }

                const data = await response.json();
                addMessage(data.response, 'bot');
            } catch (error) {
                addMessage(`错误: ${error.message}`, 'bot');
                console.error('Error:', error);
            } finally {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                sendBtn.disabled = false;
            }
        }

        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
